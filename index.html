<title>CREW CLOCK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8f4fd;
  --white:#f4faff;
  --blue:#3b82c4;--blue2:#2d6eac;
  --blue-light:rgba(59,130,196,.10);--blue-mid:rgba(59,130,196,.20);
  --tx:#1a2e42;--tx2:#4a6a85;--tx3:#8aaec8;
  --bdr:#c8e0f0;--bdr2:#a8cce4;
  --grn:#2eaa70;--red:#e0505a;--amb:#e8923a;
  --shadow:0 1px 6px rgba(59,130,196,.10),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 20px rgba(59,130,196,.16);
  --nav-bg:linear-gradient(135deg,#daeefa 0%,#f0f8ff 100%);
}
body.dark{
  --bg:#0d1f2d;--white:#162535;
  --blue:#6aafe8;--blue2:#5a9fd8;
  --blue-light:rgba(106,175,232,.13);--blue-mid:rgba(106,175,232,.24);
  --tx:#e0f0fa;--tx2:#7aaac8;--tx3:#4a7090;
  --bdr:#1e3a50;--bdr2:#2a4d68;
  --grn:#3dd68c;--red:#f07080;--amb:#f0a84a;
  --shadow:0 1px 4px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.2);
  --shadow-md:0 4px 20px rgba(0,0,0,.45);
  --nav-bg:linear-gradient(135deg,#0d1f2d 0%,#162535 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;font-size:14px;
  padding-bottom:80px;-webkit-font-smoothing:antialiased}

/* ── TOP NAV ── */
.top-nav{position:sticky;top:0;z-index:50;
  background:var(--nav-bg,var(--white));
  border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:center;
  padding:14px 20px 12px;position:relative;
  box-shadow:0 2px 8px rgba(59,130,196,.10)}
.nav-title{text-align:center;cursor:pointer;user-select:none}
.nav-title:hover h1{color:var(--blue)}
.nav-title h1{
  font-size:22px;font-weight:800;letter-spacing:4px;
  color:var(--tx);transition:color .2s;
  text-transform:uppercase;line-height:1}
.nav-title p{font-size:9px;color:var(--tx3);letter-spacing:2px;margin-top:3px;text-transform:uppercase}
.nav-bell{position:absolute;right:16px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:50%;border:none;background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx);
  transition:background .2s;position:absolute}
.nav-bell:hover{background:var(--blue-light)}
.nav-bell .badge{position:absolute;top:5px;right:5px;width:7px;height:7px;
  background:var(--red);border-radius:50%;border:2px solid var(--white);display:none}
.nav-bell .badge.show{display:block}

/* ── PAGE TABS ── */
.page-tabs{display:flex;background:var(--nav-bg,var(--white));border-bottom:1px solid var(--bdr);
  -ms-overflow-style:none;scrollbar-width:none}
.page-tabs::-webkit-scrollbar{display:none}
.ptab{flex:1;padding:11px 8px;border:none;background:transparent;
  color:var(--tx2);font-size:12px;font-weight:500;cursor:pointer;
  white-space:nowrap;transition:color .18s;border-bottom:2px solid transparent;font-family:'Inter',sans-serif}
.ptab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

/* ── PANELS ── */
.panel{display:none}.panel.show{display:block}
.sec{padding:14px 14px 0}

/* ── CALENDAR ── */
.cal-card{background:var(--white);border-radius:14px;box-shadow:var(--shadow);margin:12px 14px 0;overflow:hidden; touch-action: pan-y;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.cal-nav-btn{width:30px;height:30px;border:none;background:var(--blue-light);border-radius:8px;
  color:var(--blue);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.cal-nav-btn:hover{background:var(--blue-mid)}
.cal-month{font-size:14px;font-weight:600;color:var(--tx); cursor:pointer; padding:4px 8px; border-radius:6px; transition:all .2s;}
.cal-month:hover{background:var(--blue-light); color:var(--blue);}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);padding:0 6px 2px}
.cal-dow-cell{text-align:center;font-size:10px;font-weight:600;color:var(--tx3);padding:3px 0;letter-spacing:.3px}
.cal-dow-cell:first-child{color:var(--red)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 6px 10px}
.cal-day{height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:background .15s;border-radius:8px;position:relative}
.cal-day:hover{background:var(--blue-light)}
.cal-day.other-month .cal-day-num{opacity:.3}
.cal-day-num{width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:13px;font-weight:500;color:var(--tx)}
.cal-day.today .cal-day-num{background:var(--blue);color:#fff;font-weight:700}
.cal-day.selected:not(.today) .cal-day-num{background:var(--blue-light);color:var(--blue);font-weight:600}
.cal-day:nth-child(7n+1) .cal-day-num{color:var(--red)}
.cal-day.today .cal-day-num{color:#fff !important}
.cal-dots{display:flex;gap:2px;justify-content:center;margin-top:1px;position:absolute;bottom:3px}
.cal-dot{width:3px;height:3px;border-radius:50%}
.cal-dot.b{background:var(--blue)}.cal-dot.g{background:var(--grn)}
.cal-day.today .cal-dot{background:rgba(255,255,255,.8)}

/* ── DAY CARD (Calendar Detailed List) ── */
.day-card{background:var(--white);border-radius:14px;box-shadow:var(--shadow);margin:10px 14px 0}
.day-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0}
.day-title{font-size:13px;font-weight:700;color:var(--blue)}
.day-more{font-size:11px;color:var(--blue);font-weight:600;cursor:pointer}
.day-flights{padding:8px 6px 10px}

/* One-liner layout for day card alarms */
.dfr{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;transition:background .15s;cursor:pointer; border:1px solid var(--bdr); background:var(--white); margin-bottom:6px;}
.dfr:hover{background:var(--blue-light); border-color:var(--blue);}
.dfr-time{font-size:15px;font-weight:700;color:var(--blue);flex-shrink:0;font-family:'Share Tech Mono',monospace;}
.dfr-fnum{font-size:12px;font-weight:700;color:var(--tx2);font-family:'Share Tech Mono',monospace;flex-shrink:0;}
.dfr-info{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;}
.dfr-info::-webkit-scrollbar{display:none}
.dfr-route{font-size:13px;font-weight:600;color:var(--tx);display:flex;align-items:center;}
.dfr-route .apt{font-family:'Share Tech Mono',monospace;font-size:13px;font-weight:700}
.dfr-route .apt.dep{color:var(--blue)}
.empty-state{padding:20px;text-align:center;color:var(--tx3);font-size:12px}

/* ── BUTTONS ── */
.btn-az{width:100%;padding:12px;background:var(--blue);border:none;border-radius:10px;
  color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.btn-az:hover{background:var(--blue2);box-shadow:0 4px 16px rgba(79,110,247,.35)}
.btn-outline{background:transparent; border:1.5px solid var(--blue); color:var(--blue);}
.btn-outline:hover{background:var(--blue-light); box-shadow:none;}

/* ── FLIGHT LIST (Master List) ── */
.fal-list{display:flex;flex-direction:column;gap:8px}
.home-section-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;padding-top:4px}
.home-section-hdr h2{font-size:13px;font-weight:700;color:var(--tx);letter-spacing:.2px}

.fal-item{background:var(--white);border-radius:14px;overflow:hidden;
  border:1.5px solid var(--bdr);transition:all .2s; width: 100%; box-sizing: border-box; display: block;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
.fal-item.future{border-color:var(--bdr)}
.fal-item.today{
  border-color:var(--blue);
  box-shadow:0 2px 12px rgba(79,110,247,.15),0 1px 3px rgba(79,110,247,.1);
  background:linear-gradient(135deg,var(--white) 80%,rgba(79,110,247,.03))}
.fal-item.next-flight{
  border-color:var(--blue);border-width:2px;
  box-shadow:0 4px 20px rgba(79,110,247,.2)}
.fal-item.past{
  opacity:.35; box-shadow:none; border-color:var(--bdr); filter:saturate(.3)}

/* STRICT FLEX CONSTRAINTS TO PREVENT OVERFLOW ON SAFARI */
.fal-header{display:flex;align-items:stretch;gap:8px;padding:12px 14px 10px;cursor:pointer;user-select:none; width:100%; box-sizing:border-box;}
.fal-accent{width:3px;border-radius:2px;flex-shrink:0;background:var(--bdr2)}
.fal-item.today .fal-accent, .fal-item.next-flight .fal-accent{background:var(--blue)}
.fal-item.future .fal-accent{background:var(--grn)}
.fal-item.past .fal-accent{background:var(--bdr2)}

.fal-content{
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 0;
}
.fal-left{
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  white-space: nowrap;
  padding-bottom: 2px;
}
.fal-left::-webkit-scrollbar{display:none}
.fal-right{
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.fal-dow{font-size:15px;font-weight:800;color:var(--tx);letter-spacing:.2px}
.fal-item.today .fal-dow,.fal-item.next-flight .fal-dow{color:var(--blue)}
.fal-date{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--tx2);font-weight:500}
.fal-badge{font-size:8px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.8px;text-transform:uppercase}
.fal-badge.today-badge{background:var(--blue);color:#fff}
.fal-badge.next-badge{background:rgba(79,110,247,.12);color:var(--blue);border:1px solid rgba(79,110,247,.3)}

.fal-fnum{font-size:12px;font-weight:700;color:var(--tx2);font-family:'Share Tech Mono',monospace;margin-left:2px}
.fal-route{font-size:12px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:4px}
.fal-route .apt{font-family:'Share Tech Mono',monospace;font-size:13px;font-weight:700}
.fal-route .apt.dep{color:var(--blue)}
.fal-item.past .fal-route .apt.dep{color:var(--tx2)}
.fal-arrow{color:var(--tx3);font-size:11px}

.dep-lbl{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px}
.fal-deptime{font-family:'Share Tech Mono',monospace;font-size:22px;font-weight:700;color:var(--tx);line-height:1}
.fal-item.today .fal-deptime,.fal-item.next-flight .fal-deptime{color:var(--blue)}
.fal-item.past .fal-deptime{font-size:18px;color:var(--tx3)}

.fal-drop-btn{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--bdr);
  background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--tx3);transition:all .2s;flex-shrink:0}
.fal-drop-btn:hover{border-color:var(--blue);color:var(--blue)}
.fal-item.open .fal-drop-btn{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}
.fal-drop-btn svg{transition:transform .2s}
.fal-item.open .fal-drop-btn svg{transform:rotate(180deg)}

.fal-type{padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.5px;flex-shrink:0;}
.fal-type.base{background:var(--blue-light);color:var(--blue)}
.fal-type.intl{background:rgba(251,146,60,.1);color:var(--amb)}
.fal-type.ics{background:rgba(34,197,94,.1);color:var(--grn)}

/* ── DROPDOWN ALARM LIST ── */
.fal-alarms{display:none;border-top:1px solid var(--bdr);padding:8px 14px 12px;flex-direction:column;gap:5px;background:var(--bg)}
.fal-item.open .fal-alarms{display:flex}
.fal-alarms-hdr{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:4px}
.fal-atog{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;
  background:var(--white);border:1px solid var(--bdr);transition:all .15s}
.fal-atog.on-base{border-color:rgba(79,110,247,.3);background:var(--blue-light)}
.fal-atog.on-intl{border-color:rgba(251,146,60,.3);background:rgba(251,146,60,.06)}
.atog-info{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.atog-lbl-wrap{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.atog-lbl{font-size:11px;color:var(--tx2);font-weight:500}
.fal-atog.on-base .atog-lbl,.fal-atog.on-intl .atog-lbl{color:var(--tx);font-weight:600}
.atog-time{font-family:'Share Tech Mono',monospace;font-size:13px;font-weight:700;color:var(--tx3);line-height:1;padding-right:4px}
.atog-offset{font-size:9px;color:var(--tx3);opacity:.8;white-space:nowrap}
.fal-atog.on-base .atog-time{color:var(--blue)}
.fal-atog.on-base .atog-offset{color:var(--blue);opacity:.7}
.fal-atog.on-intl .atog-time{color:var(--amb)}
.fal-atog.on-intl .atog-offset{color:var(--amb);opacity:.7}

/* ── PAST SECTION ── */
.past-section-hdr{margin-top:14px;margin-bottom:8px}
.past-toggle-btn{width:100%;padding:9px 14px;background:var(--white);
  border:1.5px dashed var(--bdr2);border-radius:10px;color:var(--tx3);
  font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;
  font-family:'Inter',sans-serif;display:flex;align-items:center;gap:6px}
.past-toggle-btn:hover{border-color:var(--blue);color:var(--blue)}
.past-toggle-btn svg{transition:transform .2s;flex-shrink:0}
.past-toggle-btn.open svg{transform:rotate(90deg)}
#homePastSection{display:none}

/* ── TOGGLE ── */
.tog{width:36px;height:20px;border-radius:10px;background:var(--bdr2);border:none;cursor:pointer;
  position:relative;transition:all .2s;flex-shrink:0;outline:none}
.tog::after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;
  background:#fff;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--blue)}.tog.on::after{left:19px}
.tog.on-amb{background:var(--amb)}.tog.on-amb::after{left:19px}

/* ── BOTTOM FAB + UPLOAD SHEET ── */
.fab{position:fixed;bottom:24px;left:20px;width:52px;height:52px;border-radius:50%;
  background:var(--blue);border:none;color:#fff;font-size:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(59,130,196,.45);z-index:60;transition:all .2s}
.fab:hover{background:var(--blue2);transform:scale(1.06)}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:none;backdrop-filter:blur(4px)}
.sheet-overlay.show{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-radius:20px 20px 0 0;
  z-index:71;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,0,.67,0);
  max-height:90vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,16px)}
.sheet.open{transform:translateY(0);transition:transform .32s cubic-bezier(.33,1,.68,1)}
.sheet-handle{width:36px;height:4px;background:var(--bdr2);border-radius:2px;margin:12px auto 16px}
.sheet-title{font-size:15px;font-weight:700;color:var(--tx);padding:0 20px 12px;border-bottom:1px solid var(--bdr)}
.sheet-body{padding:16px 20px}

/* ── ALARM SECTION ── */
.alarm-card{background:var(--white);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.alarm-card-head{padding:14px 16px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:8px}
.alarm-card-head .ach-ico{width:28px;height:28px;border-radius:8px;background:var(--blue-light);
  display:flex;align-items:center;justify-content:center;color:var(--blue);flex-shrink:0}
.alarm-card-head .ach-lbl{font-size:13px;font-weight:700;color:var(--tx);flex:1}
.alarm-card-body{padding:14px 16px 16px}

/* ── DRUM PICKER ── */
.drum-row{display:flex;gap:6px;align-items:center;justify-content:center;margin:12px 0}
.drum-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.dc-label{font-size:9px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:1px}
.drum{width:52px;height:78px;overflow:hidden;position:relative;border-radius:10px;
  border:1.5px solid var(--bdr);background:var(--bg);cursor:grab;user-select:none;
  -webkit-user-select:none;touch-action:none}
.drum:active{cursor:grabbing}
.drum-inner{position:absolute;width:100%;will-change:transform}
.drum-item{height:26px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:500;color:var(--tx3);font-family:'Inter',sans-serif;
  transition:color .06s,font-size .06s}
.drum-item.sel{color:var(--blue);font-size:18px;font-weight:700}
.drum::before,.drum::after{content:'';position:absolute;left:0;right:0;height:26px;z-index:2;pointer-events:none}
.drum::before{top:0;background:linear-gradient(to bottom,var(--bg) 30%,transparent)}
.drum::after{bottom:0;background:linear-gradient(to top,var(--bg) 30%,transparent)}
.drum-line{position:absolute;left:4px;right:4px;top:26px;height:26px;
  border-top:1.5px solid var(--blue);border-bottom:1.5px solid var(--blue);
  z-index:1;pointer-events:none;background:var(--blue-light);border-radius:6px}
.drum-sep{font-size:18px;font-weight:600;color:var(--tx2);padding-top:10px;font-family:'Inter',sans-serif}
.dl-row{margin-bottom:12px}
.dl-row label{font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.dl-inp{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid var(--bdr);
  border-radius:9px;color:var(--tx);font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.dl-inp:focus{border-color:var(--blue)}
.dl-inp[type=date]{color-scheme:light}
body.dark .dl-inp[type=date]{color-scheme:dark}

/* ── DIRECT ALARM LIST ── */
.dal-wrap{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.dal-item{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-radius:10px;border:1.5px solid rgba(79,110,247,.15);background:var(--blue-light);animation:dalfin .22s ease}
@keyframes dalfin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dal-item.ring-now{border-color:var(--amb);background:rgba(251,146,60,.08);animation:pring2 .5s ease-in-out infinite alternate}
@keyframes pring2{from{box-shadow:none}to{box-shadow:0 0 12px rgba(251,146,60,.3)}}
.dal-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0}
.dal-item.ring-now .dal-dot{background:var(--amb);animation:blk2 .4s infinite}
@keyframes blk2{50%{opacity:0}}
.dal-info{flex:1;min-width:0}
.dal-date-row{display:flex;align-items:center;gap:4px;margin-bottom:1px}
.dal-dow{font-size:13px;font-weight:700;color:var(--tx)}
.dal-date{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--tx2)}
.dal-today{background:var(--blue);color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px}
.dal-lbl{font-size:10px;color:var(--tx2);font-weight:500}
.dal-cd{font-size:9px;color:var(--blue);margin-top:1px;font-family:'Share Tech Mono',monospace;font-weight:600}
.dal-item.ring-now .dal-cd{color:var(--amb)}
.dal-time{font-family:'Share Tech Mono',monospace;font-size:22px;font-weight:700;color:var(--blue);flex-shrink:0}
.dal-item.ring-now .dal-time{color:var(--amb)}
