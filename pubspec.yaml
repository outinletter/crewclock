name: crewclock
description: "Offline flight schedules and departure reminders for airline crew."
publish_to: 'none'

version: 1.0.6+30

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/data/airport_timezones.json
    - assets/data/airport-data-license.txt

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon/app_icon.png"
